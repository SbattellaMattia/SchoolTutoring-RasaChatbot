version: "3.1"

slots:
  materia:
    type: text
    influence_conversation: true
    mappings:
      - type: from_text
        conditions:
          - active_loop: tutoring_booking_form
            requested_slot: materia
  
  tutor_selezionato:
    type: text
    influence_conversation: false
    mappings: []  # Riempito da custom action
  
  data_lezione:
    type: text
    influence_conversation: false
    mappings: []  # Calcolata automaticamente dalla scelta slot
  
  orario_inizio:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: orario_inizio
        intent: inform_slot
  
  orario_fine:
    type: text
    influence_conversation: false
    mappings: []  # Calcolato automaticamente (inizio + 1 ora)
  
  email_studente:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: tutoring_booking_form
            requested_slot: email_studente
  
  tariffa:
    type: text
    influence_conversation: false
    mappings: []  # Riempito da custom action
  
  slot_disponibili:
    type: list
    influence_conversation: false
    mappings: []  # Lista slot liberi (usato internamente)
