version: "3.1"

responses:
  utter_greet:
    - text: "Ciao! Sono l'assistente per prenotare ripetizioni. Come posso aiutarti?"
    - text: "Benvenuto! Vuoi prenotare ripetizioni o hai bisogno di informazioni?"
  
  utter_goodbye:
    - text: "Grazie per averci contattato! Buono studio!"
    - text: "A presto! In bocca al lupo con lo studio!"
  
  utter_ask_materia:
    - text: "Per quale materia ti servono ripetizioni?\n(matematica, fisica, chimica, inglese, italiano, latino, informatica)"
  
  utter_ask_email_studente:
    - text: "Perfetto! Inserisci la tua email per confermare la prenotazione:"
  
  utter_no_tutor_available:
    - text: "Mi dispiace, al momento non ci sono tutor disponibili per questa materia 😞"
  
  utter_no_slots_available:
    - text: "Purtroppo non ci sono slot disponibili. Prova con un'altra materia o riprova più tardi."