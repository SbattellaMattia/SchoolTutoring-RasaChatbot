version: "3.1"

# Le stories sono "scenari di esempio" 
# che mostrano al bot come gestire conversazioni reali,
# permettendogli di imparare pattern e comportarsi correttamente
# anche in situazioni leggermente diverse da quelle viste durante il training.

stories:
- story: Prenotazione ripetizione con successo
  steps:
  - intent: greet
  - action: action_greet
  - intent: request_tutoring
  - action: tutoring_form
  - active_loop: tutoring_form

  # Chiede cellulare
  - slot_was_set:
    - requested_slot: cellulare
  # Utente risponde con numero
  - intent: provide_number
    entities:
      - cellulare: "+39 123 456 7890"
  - slot_was_set:
    - cellulare: "+39 123 456 7890"
      
  # Chiede materia
  - slot_was_set:
    - requested_slot: materia
  # Utente risponde con materia
  - intent: inform_slot
    entities:
      - materia: "matematica"
  - slot_was_set:
    - materia: "matematica"
      
  # Chiede data
  - slot_was_set:
    - requested_slot: data
  # Utente risponde con data
  - intent: inform_slot
  - slot_was_set:
    - data: "domani"
      
  # Chiede ora
  - slot_was_set:
    - requested_slot: ora
  # Utente risponde con ora
  - intent: inform_slot
  - slot_was_set:
    - ora: "15:00"
      
  # Form completato
  - slot_was_set:
    - requested_slot: null
  - active_loop: null

  - action: action_search_tutors
  - slot_was_set:
    - available_tutors: true
  - intent: choose_tutor
  - action: action_choose_tutor
  - action: action_save_booking
  - intent: thankyou
  - action: utter_thankyou

- story: Nessun tutor disponibile - riprova
  steps:
  - intent: greet
  - action: action_greet
  - intent: request_tutoring
  - action: tutoring_form
  - active_loop: tutoring_form
  - active_loop: null
  - action: action_search_tutors
  - slot_was_set:
    - available_tutors: false
  - action: utter_no_tutors_found
  - action: utter_ask_retry
  - intent: affirm
  - action: action_reset_slots
  - action: tutoring_form
  - active_loop: tutoring_form

- story: Nessun tutor disponibile - abbandono
  steps:
  - intent: request_tutoring
  - action: tutoring_form
  - active_loop: tutoring_form
  - active_loop: null
  - action: action_search_tutors
  - slot_was_set:
    - available_tutors: false
  - action: utter_no_tutors_found
  - action: utter_ask_retry
  - intent: deny
  - action: utter_goodbye

- story: Conversazione completa
  steps:
  - intent: greet
  - action: action_greet
  - intent: request_tutoring
  - action: tutoring_form
  - active_loop: tutoring_form
  - active_loop: null
  - action: action_search_tutors
  - slot_was_set:
    - available_tutors: true
  - intent: choose_tutor
  - action: action_choose_tutor
  - action: action_save_booking
  - intent: goodbye
  - action: utter_goodbye