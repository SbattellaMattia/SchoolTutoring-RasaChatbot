version: "3.1"

nlu:
- intent: greet
  examples: |
    - /start
    - ciao
    - buongiorno
    - buonasera
    - salve
    - hey
    - ehi
    - salut
    - ciao ciao
    - buondì
    - ehilà
    - bella
    - presente
    - hola
    - hi
    - hello

- intent: affirm
  examples: |
    - sì
    - si
    - yes
    - certo
    - va bene
    - ok
    - okay
    - perfetto
    - certamente
    - assolutamente
    - confermo
    - esatto
    - giusto
    - d'accordo
    - va benissimo

- intent: deny
  examples: |
    - no
    - no grazie
    - non mi interessa
    - voglio cambiare
    - vorrei un altro orario
    - preferisco un'altra data
    - no non va bene
    - non posso
    - non mi va bene
    - preferirei altro
    - no grazie voglio riprovare
    - cambiamo
    - riprovo

- intent: goodbye
  examples: |
    - arrivederci
    - bye
    - a presto
    - ci vediamo
    - addio
    - buona giornata
    - buona serata
    - alla prossima
    - a dopo
    - saluti
    - ci sentiamo
    - grazie e arrivederci

- intent: thankyou
  examples: |
    - grazie
    - grazie mille
    - ti ringrazio
    - grazie tante
    - thank you
    - thanks
    - grazie per l'aiuto
    - grazie di tutto
    - ottimo grazie
    - perfetto grazie
    - apprezzo molto

