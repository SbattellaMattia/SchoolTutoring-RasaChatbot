version: "3.1"

nlu:
- intent: greet
  examples: |
    - ciao
    - buongiorno
    - buonasera
    - salve
    - hey
    - ehi
    - salut
    - ciao ciao
    - buondì
    - ehilà
    - bella
    - presente
    - hola
    - hi
    - hello

- intent: request_tutoring
  examples: |
    - vorrei delle ripetizioni
    - ho bisogno di ripetizioni
    - cerco un tutor
    - mi servono delle lezioni
    - avrei bisogno di aiuto per studiare
    - ho bisogno di aiuto
    - cerco ripetizioni
    - vorrei prenotare una lezione
    - mi servirebbero delle ripetizioni
    - devo trovare un insegnante
    - mi servirebbe un aiuto per lo studio
    - sto cercando qualcuno che mi aiuti
    - posso prenotare una ripetizione?
    - voglio prenotare una lezione
    - come faccio a prenotare?

- intent: inform
  examples: |
    - [matematica](materia)
    - ho bisogno di [matematica](materia)
    - vorrei [italiano](materia)
    - mi serve [chimica](materia)
    - per [matematica](materia)
    - [chimica](materia) per favore
    - la materia è [italiano](materia)
    - [domani](data) alle [15:00](ora)
    - per [lunedì](data) alle [16:00](ora)
    - il [10 gennaio](data) alle [14:30](ora)
    - [martedì](data) alle [17:00](ora)
    - alle [15:00](ora)
    - [domani](data)
    - per [oggi](data)
    - il [5 gennaio](data)
    - [mercoledì](data) pomeriggio
    - verso le [16:00](ora)
    - alle [quattro](ora)
    - alle [15](ora)
    - intorno alle [14:00](ora)

- intent: affirm
  examples: |
    - sì
    - si
    - yes
    - certo
    - va bene
    - ok
    - okay
    - perfetto
    - certamente
    - assolutamente
    - confermo
    - esatto
    - giusto
    - d'accordo
    - va benissimo

- intent: deny
  examples: |
    - no
    - no grazie
    - non mi interessa
    - voglio cambiare
    - vorrei un altro orario
    - preferisco un'altra data
