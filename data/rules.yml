version: "3.1"

rules:
  - rule: Saluta
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Arrivederci
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Attiva prenotazione
    steps:
      - intent: book_tutoring
      - action: tutoring_booking_form
      - active_loop: tutoring_booking_form

  # ✅ IMPORTANTE: Mostra slot DOPO che materia è validata
  - rule: Mostra slot disponibili dopo materia
    condition:
      - active_loop: tutoring_booking_form
    steps:
      - slot_was_set:
          - materia
      - action: action_show_available_slots

  # ✅ Conferma prenotazione quando form è completo
  - rule: Conferma prenotazione
    condition:
      - active_loop: tutoring_booking_form
    steps:
      - action: tutoring_booking_form
      - active_loop: null
      - action: action_confirm_booking
