version: "3.1"

rules:
- rule: Saluta l'utente
  steps:
  - intent: greet
  - action: action_greet

- rule: Attiva form per prenotazione ripetizioni
  steps:
  - intent: request_tutoring
  - action: tutoring_form
  - active_loop: tutoring_form

- rule: Rispondi a goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Rispondi a thankyou
  steps:
  - intent: thankyou
  - action: utter_thankyou

#- rule: Restart conversation
  #steps:
    #- intent: restart
    #- action: action_reset_slots
- rule: Restart conversation
  steps:
  - intent: restart
  - action: action_restart 

- rule: Help command
  steps:
    - intent: help
    - action: utter_help
