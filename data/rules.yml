  - action: action_greet

- rule: Rispondi a goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Rispondi a thankyou
  steps:
  - intent: thankyou
  - action: utter_thankyou

- rule: Help command
  steps:
    - intent: help
    - action: utter_app_detail
