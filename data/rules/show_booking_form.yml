version: "3.1"

rules:
  - rule: Attiva form telefono per show_bookings
    steps:
      - intent: show_bookings
      - action: phone_form
      - active_loop: phone_form
  
  - rule: Dopo phone_form mostra prenotazioni
    condition:
      - active_loop: phone_form
    steps:
      - action: phone_form
      - active_loop: null
      - slot_was_set:
        - requested_slot: null
      - action: action_show_bookings
      - action: action_reset_slots
      - action: utter_next_action